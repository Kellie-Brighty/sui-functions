<svg id="flowchart-svg" xmlns="http://www.w3.org/2000/svg" width="800" height="1100" viewBox="0 0 800 1100" class="shadow-2xl rounded-2xl bg-white border border-slate-200/80 cursor-grab active:cursor-grabbing transition-all-300" style="background-color: rgb(255, 255, 255); border-color: rgb(226, 232, 240);">
            <!-- Defs for arrowheads, glows, and filters -->
            <defs>
              <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748B"></path>
              </marker>
              <marker id="arrow-selected" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#0D9488"></path>
              </marker>
              <marker id="arrow-cyber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8"></path>
              </marker>
              <marker id="arrow-mono" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                <path d="M 0 1 L 10 5 L 0 9 z" fill="#000"></path>
              </marker>

              <!-- Node shadow filters -->
              <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
                <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" flood-color="#0F172A"></feDropShadow>
              </filter>
            </defs>

            <!-- Grid Helper -->
            <g id="grid-helper" class="opacity-10"></g>

            <!-- Dynamic connections/arrows layer -->
            <g id="connections-layer"><path d="M 400 85 C 400 107, 400 118, 400 140" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><path d="M 400 200 C 400 222, 400 233, 400 255" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><g><rect x="340" y="216.5" width="120" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="400" y="229.5" text-anchor="middle" font-size="10px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#475569">Auth</text></g><path d="M 400 325 C 400 347, 400 358, 400 380" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><g><rect x="340" y="341.5" width="120" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="400" y="354.5" text-anchor="middle" font-size="10px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#475569">Add script</text></g><path d="M 400 440 C 400 464, 400 476, 400 500" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><g><rect x="340" y="459" width="120" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="400" y="472" text-anchor="middle" font-size="10px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#475569">Route secure keys</text></g><path d="M 400 580 C 400 610, 400 625, 400 655" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><g><rect x="340" y="606.5" width="120" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="400" y="619.5" text-anchor="middle" font-size="10px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#475569">Deploy Signed File</text></g><path d="M 400 725 C 400 754, 400 768.5, 400 797.5" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><g><rect x="340" y="750.25" width="120" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="400" y="763.25" text-anchor="middle" font-size="10px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#475569">Generates Function ID</text></g><path d="M 400 862.5 C 400 889.5, 400 903, 400 930" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><g><rect x="340" y="885.25" width="120" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="400" y="898.25" text-anchor="middle" font-size="10px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#475569">Compute event</text></g><path d="M 400 990 C 400 1008, 400 1017, 400 1035" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><g><rect x="340" y="1001.5" width="120" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="400" y="1014.5" text-anchor="middle" font-size="10px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#475569">SUI gas payment</text></g><path d="M 325 540 L 130 540 L 130 690 L 295 690" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow)"></path><g><rect x="115" y="579" width="120" height="18" rx="4" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"></rect><text x="175" y="592" text-anchor="middle" font-size="10px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#475569">Proxy bypass</text></g></g>

            <!-- Dynamic flow animation layer -->
            <g id="flow-animation-layer"><path d="M 400 85 C 400 107, 400 118, 400 140" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path><path d="M 400 200 C 400 222, 400 233, 400 255" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path><path d="M 400 325 C 400 347, 400 358, 400 380" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path><path d="M 400 440 C 400 464, 400 476, 400 500" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path><path d="M 400 580 C 400 610, 400 625, 400 655" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path><path d="M 400 725 C 400 754, 400 768.5, 400 797.5" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path><path d="M 400 862.5 C 400 889.5, 400 903, 400 930" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path><path d="M 400 990 C 400 1008, 400 1017, 400 1035" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path><path d="M 325 540 L 130 540 L 130 690 L 295 690" fill="none" stroke-width="2.5" class="flow-pulse" stroke="#0D9488"></path></g>

            <!-- Dynamic nodes layer -->
            <g id="nodes-layer"><g transform="translate(400, 60)" class="cursor-pointer transition-all-300" style="user-select: none;"><rect x="-60" y="-25" width="120" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#shadow)"></rect><text x="0" y="4" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A">Dashboard Start</text></g><g transform="translate(400, 170)" class="cursor-pointer transition-all-300" style="user-select: none;"><rect x="-90" y="-30" width="180" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"></rect><text x="0" y="4" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A">Connect Sui Wallet</text></g><g transform="translate(400, 290)" class="cursor-pointer transition-all-300" style="user-select: none;"><path d="M -100 -35 L 100 -35 L 100 27 Q 50 19 0 27 T -100 35 Z" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"></path><text x="0" y="4" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A">Configure Agent Logic</text></g><g transform="translate(400, 410)" class="cursor-pointer transition-all-300" style="user-select: none;"><rect x="-90" y="-30" width="180" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"></rect><text x="0" y="4" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A">Add Web2 Secret Keys</text></g><g transform="translate(400, 540)" class="cursor-pointer transition-all-300" style="user-select: none;"><polygon points="0,-40 75,0 0,40 -75,0" fill="#FFFFFF" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"></polygon><text x="0" y="4" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A">Seal Proxy Required?</text></g><g transform="translate(400, 690)" class="cursor-pointer transition-all-300" style="user-select: none;"><path d="M -105 -25 L -105 25 A 105 10 0 0 0 105 25 L 105 -25 A 105 10 0 0 0 -105 -25" fill="#FFFFFF" stroke="#EF4444" stroke-width="1.5"></path><ellipse cx="0" cy="-25" rx="105" ry="10" fill="#F1F5F9" stroke="#EF4444" stroke-width="1.5"></ellipse><path d="M -105 -11.666666666666666 A 105 10 0 0 0 105 -11.666666666666666" fill="none" stroke="#EF4444" stroke-dasharray="3 3" stroke-width="1.5"></path><path d="M -105 11.666666666666666 A 105 10 0 0 0 105 11.666666666666666" fill="none" stroke="#EF4444" stroke-dasharray="3 3" stroke-width="1.5"></path><text x="0" y="2" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A"><tspan x="0">Deploy to</tspan><tspan x="0" dy="13">Walrus Protocol</tspan></text></g><g transform="translate(400, 830)" class="cursor-pointer transition-all-300" style="user-select: none;"><polygon points="-98,-32.5 110,-32.5 98,32.5 -110,32.5" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#shadow)"></polygon><text x="0" y="-3" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A"><tspan x="0">Trigger via</tspan><tspan x="0" dy="13">Move Contract</tspan></text></g><g transform="translate(400, 960)" class="cursor-pointer transition-all-300" style="user-select: none;"><rect x="-90" y="-30" width="180" height="60" rx="8" ry="8" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"></rect><text x="0" y="4" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A">Autonomous Edge Play</text></g><g transform="translate(400, 1060)" class="cursor-pointer transition-all-300" style="user-select: none;"><rect x="-55" y="-25" width="110" height="50" rx="25" ry="25" fill="#FFFFFF" stroke="#0D9488" stroke-width="1.5" filter="url(#shadow)"></rect><text x="0" y="4" text-anchor="middle" font-size="11px" font-weight="700" font-family="&quot;Plus Jakarta Sans&quot;, sans-serif" fill="#0F172A">End Lifecycle</text></g></g>
          </svg>